name: Build and Release Docker Image

# 触发条件：
#   1. 推送 v* 形式的 tag（如 v1.0.0）→ 自动构建并发布到对应 Release
#   2. 手动触发（workflow_dispatch）→ 可指定 version，便于测试
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.0，留空则用短 SHA）'
        required: false
        default: ''

permissions:
  contents: write   # 创建 Release、上传资源需要

jobs:
  # ============ 构建矩阵：amd64 与 arm64 并行构建 ============
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            docker_platform: linux/amd64
          - platform: arm64
            docker_platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算版本号
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="v${GITHUB_SHA::7}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tar=mimo-gateway-${V}-${{ matrix.platform }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU（arm64 交叉构建需要）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（加载到本地 docker）
        uses: docker/build-push-action@v6
        env:
          # 禁用 buildx 自动上传 .dockerbuild 构建记录 artifact，
          # 避免污染 release 下载步骤（只保留镜像 tar.gz）
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.docker_platform }}
          load: true
          tags: mimo-gateway:${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: 导出镜像为 tar 并压缩
        run: |
          docker save mimo-gateway:${{ matrix.platform }} -o image.tar
          gzip -9 image.tar
          mv image.tar.gz "${{ steps.ver.outputs.tar }}"
          ls -lh "${{ steps.ver.outputs.tar }}"

      - name: 上传构建产物（供 release 任务收集）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.tar }}
          path: ${{ steps.ver.outputs.tar }}
          retention-days: 3

  # ============ 收集所有架构产物，创建 Release ============
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 计算版本号
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="v${GITHUB_SHA::7}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
          # 只下载镜像压缩包，过滤掉可能残留的 .dockerbuild 等其它 artifact
          pattern: mimo-gateway-*.tar.gz

      - name: 查看产物
        run: ls -lh assets/

      - name: 创建 Release 并上传镜像
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          # 手动触发且非 tag 时，作为 prerelease 草稿
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: true
          files: |
            assets/*.tar.gz
          body: |
            ## Docker 镜像

            本次发布包含两种 CPU 架构的 Docker 镜像压缩包：

            | 文件 | 架构 | 适用场景 |
            |------|------|----------|
            `mimo-gateway-${{ steps.ver.outputs.version }}-amd64.tar.gz` | linux/amd64 | 普通 PC / 云服务器 |
            `mimo-gateway-${{ steps.ver.outputs.version }}-arm64.tar.gz` | linux/arm64 | Apple Silicon / 树莓派 / ARM 服务器 |

            ### 使用方法

            ```bash
            # 1. 下载对应架构的 .tar.gz 并解压
            gunzip mimo-gateway-${{ steps.ver.outputs.version }}-amd64.tar.gz

            # 2. 导入镜像
            docker load -i mimo-gateway-${{ steps.ver.outputs.version }}-amd64.tar

            # 3. 运行（无需再构建）
            docker run -d --name mimo-gateway \
              -p 8080:8080 \
              -e MIMO_API_KEY="sk-改成强随机值" \
              -v mimo-data:/app/data \
              --restart unless-stopped \
              mimo-gateway:amd64
            ```

            也可配合仓库里的 `docker-compose.yml` 使用，把 `image: mimo-gateway:latest` 改为
            `image: mimo-gateway:amd64`（或 arm64），然后 `docker compose up -d`。

            打开 `http://localhost:8080`，输入 API Key 解锁管理面板，添加 MiMo 账号即可。

            > 默认 API Key 为 `sk-mimo`，**强烈建议**通过 `MIMO_API_KEY` 环境变量改为强随机值。
